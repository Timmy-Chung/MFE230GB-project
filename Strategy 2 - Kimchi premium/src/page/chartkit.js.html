<script>/* Crowded Carry: small dependency-free SVG/canvas chart kit.
   Every chart reads colours from CSS custom properties, so light/dark themes just work. */
const CC = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";

  function svgEl(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function div(cls, parent, text) {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    if (parent) parent.appendChild(d);
    return d;
  }

  // ---------- number formatting
  const fmt = {
    pct: (v, d = 1) => (v == null || isNaN(v) ? "–" : (v * 100).toFixed(d) + "%"),
    spct: (v, d = 1) => (v == null || isNaN(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%"),
    num: (v, d = 2) => (v == null || isNaN(v) ? "–" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(d)),
    snum: (v, d = 2) => (v == null || isNaN(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d)),
    bp: (v, d = 0) => (v == null || isNaN(v) ? "–" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + " bp"),
    x: (v, d = 2) => (v == null || isNaN(v) ? "–" : v.toFixed(d) + "×"),
    date: (t) => { const d = new Date(t); return d.toISOString().slice(0, 10); },
    month: (t) => { const d = new Date(t); return d.toLocaleString("en-US", { month: "short", year: "numeric", timeZone: "UTC" }); },
  };

  // ---------- ticks
  function niceStep(span, n) {
    const raw = span / Math.max(1, n);
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
  }
  function niceTicks(min, max, n = 5) {
    if (min === max) { min -= 1; max += 1; }
    const step = niceStep(max - min, n);
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = lo; v <= hi + step * 1e-9; v += step) ticks.push(+v.toFixed(12));
    return { lo, hi, ticks, step };
  }
  function yearTicks(t0, t1, maxTicks) {
    const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(t1).getUTCFullYear();
    const span = y1 - y0 + 1;
    const every = [1, 2, 3, 4, 5, 10].find((e) => span / e <= maxTicks) || 10;
    const out = [];
    for (let y = Math.ceil(y0 / every) * every; y <= y1; y += every) {
      const t = Date.UTC(y, 0, 1);
      if (t >= t0 && t <= t1) out.push(t);
    }
    if (out.length < 2 && span <= 3) {           // short windows: quarterly ticks
      const res = [];
      for (let y = y0; y <= y1; y++) for (let q = 0; q < 12; q += 3) { const t = Date.UTC(y, q, 1); if (t >= t0 && t <= t1) res.push(t); }
      return res;
    }
    return out;
  }

  // ---------- tooltip (one per page)
  let tipEl = null;
  function tip() {
    if (!tipEl) { tipEl = div("cc-tip", document.body); tipEl.setAttribute("role", "status"); tipEl.hidden = true; }
    return tipEl;
  }
  function showTip(x, y, title, rows) {
    const t = tip();
    t.replaceChildren();
    if (title) div("cc-tip-title", t, title);
    for (const r of rows) {
      const row = div("cc-tip-row", t);
      if (r.color) { const k = div("cc-tip-key", row); k.style.background = r.color; if (r.kind === "box") k.classList.add("box"); }
      div("cc-tip-val", row, r.value);
      div("cc-tip-name", row, r.name);
    }
    t.hidden = false;
    const pad = 14, w = t.offsetWidth, h = t.offsetHeight;
    let left = x + pad, top = y + pad;
    if (left + w > window.innerWidth - 8) left = x - w - pad;
    if (top + h > window.innerHeight - 8) top = y - h - pad;
    t.style.left = Math.max(8, left) + "px";
    t.style.top = Math.max(8, top) + "px";
  }
  function hideTip() { if (tipEl) tipEl.hidden = true; }

  // ---------- responsive helper
  function responsive(container, render) {
    let lastW = 0;
    const go = () => { const w = container.clientWidth; if (w && Math.abs(w - lastW) > 2) { lastW = w; render(w); } };
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(go).observe(container);
    window.addEventListener("resize", go);
    go();
    return { redraw: () => { lastW = 0; go(); } };
  }

  function bisect(xs, t) {
    let lo = 0, hi = xs.length - 1;
    if (t <= xs[0]) return 0;
    if (t >= xs[hi]) return hi;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] <= t) lo = m; else hi = m; }
    return t - xs[lo] < xs[hi] - t ? lo : hi;
  }

  // ---------- legend (HTML, mirrors the mark)
  function legend(parent, items, kind = "line") {
    const lg = div("cc-legend", parent);
    for (const it of items) {
      const li = div("cc-legend-item", lg);
      const k = div("cc-legend-key " + kind, li);
      k.style.background = it.color;
      div("cc-legend-label", li, it.name);
    }
    return lg;
  }

  // =====================================================================================
  // Line chart
  // opts: { x:[ms], series:[{name,values,colorVar,width}], height, yFmt, tipFmt, baseline, shade:[{x0,x1,label}],
  //         marks:[{x,label}], yLabel, endLabels:true }
  function lineChart(container, opts) {
    container.classList.add("cc-chart");
    container.replaceChildren();
    const head = div("cc-chart-head", container);
    const leg = div("cc-legend-wrap", head);
    const box = div("cc-plot", container);
    let state = { opts };
    function render(W) {
      const o = state.opts;
      box.replaceChildren();
      leg.replaceChildren();
      const series = o.series.filter((s) => !s.hidden);
      if (series.length > 1 && o.legend !== false) legend(leg, series.map((s) => ({ name: s.name, color: cssVar(s.colorVar) })), "line");
      const H = o.height || 300;
      const endW = o.endLabels === false ? 0 : 92;
      const m = { l: 48, r: 12 + endW, t: 10, b: 26 };
      const iw = Math.max(50, W - m.l - m.r), ih = H - m.t - m.b;
      const xs = o.x;
      const t0 = xs[0], t1 = xs[xs.length - 1];
      let ymin = Infinity, ymax = -Infinity;
      for (const s of series) for (const v of s.values) if (v != null && isFinite(v)) { if (v < ymin) ymin = v; if (v > ymax) ymax = v; }
      if (o.baseline != null) { ymin = Math.min(ymin, o.baseline); ymax = Math.max(ymax, o.baseline); }
      for (const hl of o.hlines || []) { ymin = Math.min(ymin, hl.y); ymax = Math.max(ymax, hl.y); }
      if (!isFinite(ymin)) { ymin = 0; ymax = 1; }
      const nt = niceTicks(ymin, ymax, Math.max(3, Math.round(ih / 55)));
      const X = (t) => m.l + ((t - t0) / (t1 - t0 || 1)) * iw;
      const Y = (v) => m.t + (1 - (v - nt.lo) / (nt.hi - nt.lo || 1)) * ih;
      const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.aria || "line chart" }, box);
      svg.setAttribute("tabindex", "0");
      // shading
      for (const sh of o.shade || []) {
        const a = Math.max(t0, sh.x0), b = Math.min(t1, sh.x1);
        if (b <= a) continue;
        svgEl("rect", { x: X(a), y: m.t, width: Math.max(1, X(b) - X(a)), height: ih, fill: cssVar("--shade") }, svg);
        if (sh.label) { const tx = svgEl("text", { x: X(a) + 4, y: m.t + 12, class: "cc-axis-text", fill: cssVar("--muted") }, svg); tx.textContent = sh.label; }
      }
      // grid + y ticks
      for (const v of nt.ticks) {
        svgEl("line", { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), stroke: cssVar("--hair"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
        const tx = svgEl("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end", class: "cc-axis-text", fill: cssVar("--muted") }, svg);
        tx.textContent = (o.yFmt || fmt.num)(v);
      }
      if (o.baseline != null) svgEl("line", { x1: m.l, x2: m.l + iw, y1: Y(o.baseline), y2: Y(o.baseline), stroke: cssVar("--axis"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
      for (const hl of o.hlines || []) {
        if (hl.y < nt.lo || hl.y > nt.hi) continue;
        svgEl("line", { x1: m.l, x2: m.l + iw, y1: Y(hl.y), y2: Y(hl.y), stroke: cssVar(hl.colorVar || "--div-pos"), "stroke-width": 1.5 }, svg);
        if (hl.label) { const tx = svgEl("text", { x: m.l + 6, y: Y(hl.y) - 6, class: "cc-axis-text", fill: cssVar("--ink-2") }, svg); tx.textContent = hl.label; }
      }
      // x ticks
      const xt = yearTicks(t0, t1, Math.max(3, Math.floor(iw / 70)));
      for (const t of xt) {
        svgEl("line", { x1: X(t), x2: X(t), y1: m.t + ih, y2: m.t + ih + 4, stroke: cssVar("--axis") }, svg);
        const tx = svgEl("text", { x: X(t), y: H - 6, "text-anchor": "middle", class: "cc-axis-text", fill: cssVar("--muted") }, svg);
        const d = new Date(t);
        tx.textContent = d.getUTCMonth() === 0 ? String(d.getUTCFullYear()) : fmt.month(t);
      }
      // event marks
      for (const mk of o.marks || []) {
        if (mk.x < t0 || mk.x > t1) continue;
        svgEl("line", { x1: X(mk.x), x2: X(mk.x), y1: m.t, y2: m.t + ih, stroke: cssVar("--axis"), "stroke-width": 1 }, svg);
        const tx = svgEl("text", { x: X(mk.x) + 4, y: m.t + ih - 6, class: "cc-axis-text", fill: cssVar("--ink-2") }, svg);
        tx.textContent = mk.label;
      }
      // lines (decimate to ~2 points per pixel)
      const stepN = Math.max(1, Math.floor(xs.length / (iw * 2)));
      const ends = [];
      series.forEach((s, si) => {
        let d = "", pen = false;
        for (let i = 0; i < xs.length; i += stepN) {
          const v = s.values[i];
          if (v == null || !isFinite(v)) { pen = false; continue; }
          d += (pen ? "L" : "M") + X(xs[i]).toFixed(1) + "," + Y(v).toFixed(1);
          pen = true;
        }
        const last = xs.length - 1;
        if (s.values[last] != null) d += "L" + X(xs[last]).toFixed(1) + "," + Y(s.values[last]).toFixed(1);
        svgEl("path", { d, fill: "none", stroke: cssVar(s.colorVar), "stroke-width": s.width || 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
        // end dot + label
        let li = last; while (li > 0 && (s.values[li] == null || !isFinite(s.values[li]))) li--;
        ends.push({ y: Y(s.values[li]), x: X(xs[li]), v: s.values[li], s });
      });
      ends.forEach((e) => svgEl("circle", { cx: e.x, cy: e.y, r: 4, fill: cssVar(e.s.colorVar), stroke: cssVar("--surface"), "stroke-width": 2 }, svg));
      if (endW) {
        // end labels with simple collision handling: drop a label that would overlap a previous one
        const placed = [];
        ends.slice().sort((a, b) => a.y - b.y).forEach((e) => {
          if (placed.some((p) => Math.abs(p - e.y) < 13)) return;
          placed.push(e.y);
          const tx = svgEl("text", { x: e.x + 8, y: e.y + 4, class: "cc-end-label", fill: cssVar("--ink") }, svg);
          tx.textContent = (o.endFmt || o.yFmt || fmt.num)(e.v);
          const tn = svgEl("tspan", { fill: cssVar("--ink-2"), dx: 4 }, tx);
          tn.textContent = e.s.short || "";
        });
      }
      // crosshair
      const cross = svgEl("line", { y1: m.t, y2: m.t + ih, stroke: cssVar("--ink-2"), "stroke-width": 1, visibility: "hidden" }, svg);
      const dots = series.map((s) => svgEl("circle", { r: 4, fill: cssVar(s.colorVar), stroke: cssVar("--surface"), "stroke-width": 2, visibility: "hidden" }, svg));
      const hit = svgEl("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" }, svg);
      let cur = xs.length - 1;
      const showAt = (i, cx, cy) => {
        cur = i;
        const px = X(xs[i]);
        cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
        series.forEach((s, k) => {
          const v = s.values[i];
          if (v == null || !isFinite(v)) { dots[k].setAttribute("visibility", "hidden"); return; }
          dots[k].setAttribute("cx", px); dots[k].setAttribute("cy", Y(v)); dots[k].setAttribute("visibility", "visible");
        });
        const rows = series.map((s) => ({ name: s.name, value: (o.tipFmt || o.yFmt || fmt.num)(s.values[i]), color: cssVar(s.colorVar) }));
        const r = svg.getBoundingClientRect();
        showTip(cx != null ? cx : r.left + px, cy != null ? cy : r.top + m.t + 20, (o.xFmt || fmt.date)(xs[i]), rows);
      };
      const hide = () => { cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); hideTip(); };
      hit.addEventListener("pointermove", (ev) => {
        const r = svg.getBoundingClientRect();
        const t = t0 + ((ev.clientX - r.left - m.l) / iw) * (t1 - t0);
        showAt(bisect(xs, t), ev.clientX, ev.clientY);
      });
      hit.addEventListener("pointerleave", hide);
      svg.addEventListener("keydown", (ev) => {
        if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
          ev.preventDefault();
          const jump = Math.max(1, Math.round(xs.length / 100));
          showAt(Math.min(xs.length - 1, Math.max(0, cur + (ev.key === "ArrowRight" ? jump : -jump))));
        }
      });
      svg.addEventListener("blur", hide);
      svg.addEventListener("focus", () => showAt(cur));
    }
    const rs = responsive(box, render);
    return { update: (newOpts) => { state.opts = Object.assign({}, state.opts, newOpts); rs.redraw(); }, redraw: rs.redraw };
  }

  // =====================================================================================
  // Grouped bar chart (vertical). opts: { categories:[..], series:[{name, values, colorVar}], height, yFmt, valueLabels }
  function barChart(container, opts) {
    container.classList.add("cc-chart");
    container.replaceChildren();
    const head = div("cc-chart-head", container);
    const box = div("cc-plot", container);
    function render(W) {
      const o = opts;
      box.replaceChildren(); head.replaceChildren();
      if (o.series.length > 1) legend(head, o.series.map((s) => ({ name: s.name, color: cssVar(s.colorVar) })), "box");
      const H = o.height || 260;
      const m = { l: 52, r: 10, t: 16, b: o.rotate ? 64 : 40 };
      const iw = Math.max(60, W - m.l - m.r), ih = H - m.t - m.b;
      let vmin = 0, vmax = 0;
      for (const s of o.series) s.values.forEach((v, i) => {
        if (v == null || !isFinite(v)) return;
        const e = s.err ? s.err[i] || 0 : 0;
        vmin = Math.min(vmin, v - e); vmax = Math.max(vmax, v + e);
      });
      if (o.ymin != null) vmin = Math.min(vmin, o.ymin);
      if (o.ymax != null) vmax = Math.max(vmax, o.ymax);
      const nt = niceTicks(vmin, vmax, Math.max(3, Math.round(ih / 50)));
      const Y = (v) => m.t + (1 - (v - nt.lo) / (nt.hi - nt.lo || 1)) * ih;
      const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.aria || "bar chart" }, box);
      for (const v of nt.ticks) {
        svgEl("line", { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), stroke: cssVar(v === 0 ? "--axis" : "--hair"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
        const tx = svgEl("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end", class: "cc-axis-text", fill: cssVar("--muted") }, svg);
        tx.textContent = (o.yFmt || fmt.num)(v);
      }
      const nc = o.categories.length, ns = o.series.length;
      const band = iw / nc;
      const bw = Math.min(24, (band * 0.72 - 2 * (ns - 1)) / ns);
      const groupW = ns * bw + (ns - 1) * 2;
      o.categories.forEach((c, ci) => {
        const gx = m.l + ci * band + (band - groupW) / 2;
        o.series.forEach((s, si) => {
          const v = s.values[ci];
          if (v == null || !isFinite(v)) return;
          const x = gx + si * (bw + 2);
          const y0 = Y(0), y1 = Y(v);
          const h = Math.abs(y1 - y0);
          const r = Math.min(4, h / 2, bw / 2);
          // rounded data-end, square at the baseline
          let d;
          if (v >= 0) d = `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z`;
          else d = `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 - r}V${y0}Z`;
          const p = svgEl("path", { d, fill: cssVar(s.colorVars ? s.colorVars[ci] : s.colorVar), class: "cc-bar" }, svg);
          if (s.err && s.err[ci]) {
            const e = s.err[ci], cx = x + bw / 2;
            svgEl("line", { x1: cx, x2: cx, y1: Y(v - e), y2: Y(v + e), stroke: cssVar("--ink"), "stroke-width": 1.5 }, svg);
            for (const yy of [v - e, v + e]) svgEl("line", { x1: cx - 6, x2: cx + 6, y1: Y(yy), y2: Y(yy), stroke: cssVar("--ink"), "stroke-width": 1.5 }, svg);
          }
          const hitR = svgEl("rect", { x: x - 2, y: Math.min(y0, y1) - 6, width: bw + 4, height: h + 12, fill: "transparent", tabindex: 0 }, svg);
          const show = (ev) => {
            p.classList.add("hover");
            const rr = hitR.getBoundingClientRect();
            const rows = [{ name: s.name, value: (o.tipFmt || o.yFmt || fmt.num)(v), color: cssVar(s.colorVars ? s.colorVars[ci] : s.colorVar), kind: "box" }];
            if (s.err && s.err[ci]) rows.push({ name: "95% interval half-width", value: "±" + (o.tipFmt || o.yFmt || fmt.num)(s.err[ci]) });
            if (s.extra && s.extra[ci]) rows.push({ name: s.extra[ci].name, value: s.extra[ci].value });
            showTip(ev && ev.clientX ? ev.clientX : rr.right, ev && ev.clientY ? ev.clientY : rr.top, String(c).replace("\n", " "), rows);
          };
          hitR.addEventListener("pointermove", show);
          hitR.addEventListener("focus", () => show());
          const off = () => { p.classList.remove("hover"); hideTip(); };
          hitR.addEventListener("pointerleave", off);
          hitR.addEventListener("blur", off);
          if (o.valueLabels) {
            const tx = svgEl("text", { x: x + bw / 2, y: v >= 0 ? y1 - 5 : y1 + 13, "text-anchor": "middle", class: "cc-val-text", fill: cssVar("--ink-2") }, svg);
            tx.textContent = (o.labelFmt || o.yFmt || fmt.num)(v);
          }
        });
        const lx = m.l + ci * band + band / 2;
        if (o.rotate) {
          const tx = svgEl("text", { x: lx, y: m.t + ih + 12, "text-anchor": "end", transform: `rotate(-35 ${lx} ${m.t + ih + 12})`, class: "cc-axis-text", fill: cssVar("--ink-2") }, svg);
          tx.textContent = c;
        } else {
          const lines = String(c).split("\n");
          lines.forEach((ln, k) => {
            const tx = svgEl("text", { x: lx, y: m.t + ih + 16 + k * 13, "text-anchor": "middle", class: "cc-axis-text", fill: cssVar("--ink-2") }, svg);
            tx.textContent = ln;
          });
        }
      });
      if (o.yLabel) {
        const tx = svgEl("text", { x: 12, y: m.t + ih / 2, transform: `rotate(-90 12 ${m.t + ih / 2})`, "text-anchor": "middle", class: "cc-axis-text", fill: cssVar("--muted") }, svg);
        tx.textContent = o.yLabel;
      }
    }
    return responsive(box, render);
  }

  // =====================================================================================
  // Heatmap on canvas. opts: { rows:[names], cols:[ms], values: rows x cols (null ok), clamp, tipFn(r,c,v), height }
  function divergingColor(v, clamp) {
    const neg = cssVar("--div-neg"), pos = cssVar("--div-pos"), mid = cssVar("--div-mid");
    const t = Math.max(-1, Math.min(1, v / clamp));
    const a = hexToRgb(mid), b = hexToRgb(t < 0 ? neg : pos);
    const k = Math.abs(t);
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * k)},${Math.round(a[1] + (b[1] - a[1]) * k)},${Math.round(a[2] + (b[2] - a[2]) * k)})`;
  }
  function hexToRgb(h) {
    h = h.replace("#", "");
    if (h.length === 3) h = h.split("").map((c) => c + c).join("");
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function heatmap(container, opts) {
    container.classList.add("cc-chart");
    container.replaceChildren();
    const box = div("cc-plot", container);
    const keyRow = div("cc-heat-key", container);
    function renderKey() {
      keyRow.replaceChildren();
      div("cc-heat-key-label", keyRow, opts.keyLeft || "crowd short");
      const bar = div("cc-heat-key-bar", keyRow);
      const steps = 11;
      for (let i = 0; i < steps; i++) { const s = div("cc-heat-key-step", bar); s.style.background = divergingColor(-opts.clamp + (2 * opts.clamp * i) / (steps - 1), opts.clamp); }
      div("cc-heat-key-label", keyRow, opts.keyRight || "crowd long");
    }
    function render(W) {
      box.replaceChildren();
      renderKey();
      const rows = opts.rows, cols = opts.cols;
      const rh = opts.rowHeight || 22;
      const m = { l: 44, r: 8, t: 6, b: 24 };
      const H = m.t + m.b + rows.length * rh;
      const iw = Math.max(50, W - m.l - m.r);
      const wrap = div("cc-heat", box);
      wrap.style.height = H + "px";
      const cv = document.createElement("canvas");
      const dpr = window.devicePixelRatio || 1;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + "px"; cv.style.height = H + "px";
      cv.setAttribute("role", "img");
      cv.setAttribute("aria-label", opts.aria || "heatmap");
      wrap.appendChild(cv);
      const ctx = cv.getContext("2d");
      ctx.scale(dpr, dpr);
      const cw = iw / cols.length;
      ctx.font = "12px " + cssVar("--font-body");
      rows.forEach((name, r) => {
        ctx.fillStyle = cssVar("--ink-2");
        ctx.textAlign = "right";
        ctx.fillText(name, m.l - 8, m.t + r * rh + rh / 2 + 4);
        for (let c = 0; c < cols.length; c++) {
          const v = opts.values[r][c];
          ctx.fillStyle = v == null ? cssVar("--surface") : divergingColor(v, opts.clamp);
          ctx.fillRect(m.l + c * cw, m.t + r * rh + 1, Math.ceil(cw) + 0.5, rh - 2);
        }
        if (opts.marks) {
          ctx.fillStyle = cssVar("--ink");
          for (let c = 0; c < cols.length; c++) if (opts.marks[r][c]) ctx.fillRect(m.l + c * cw, m.t + r * rh + rh / 2 - 1, Math.max(1, cw), 2);
        }
      });
      // x labels (years)
      const t0 = cols[0], t1 = cols[cols.length - 1];
      ctx.fillStyle = cssVar("--muted");
      ctx.textAlign = "center";
      for (const t of yearTicks(t0, t1, Math.floor(iw / 60))) {
        const x = m.l + ((t - t0) / (t1 - t0)) * iw;
        ctx.fillText(String(new Date(t).getUTCFullYear()), x, H - 6);
      }
      const hl = div("cc-heat-hl", wrap);
      hl.hidden = true;
      cv.addEventListener("pointermove", (ev) => {
        const rr = cv.getBoundingClientRect();
        const x = ev.clientX - rr.left - m.l, y = ev.clientY - rr.top - m.t;
        const c = Math.floor(x / cw), r = Math.floor(y / rh);
        if (c < 0 || c >= cols.length || r < 0 || r >= rows.length) { hideTip(); hl.hidden = true; return; }
        hl.hidden = false;
        hl.style.left = m.l + c * cw - 1 + "px"; hl.style.top = m.t + r * rh + "px";
        hl.style.width = Math.max(3, cw + 2) + "px"; hl.style.height = rh + "px";
        const info = opts.tipFn(r, c, opts.values[r][c]);
        showTip(ev.clientX, ev.clientY, info.title, info.rows);
      });
      cv.addEventListener("pointerleave", () => { hideTip(); hl.hidden = true; });
    }
    return responsive(box, render);
  }

  // =====================================================================================
  // Histogram with a marker. opts: { values:[], bins, marker:{value,label}, xFmt, colorVar }
  function histogram(container, opts) {
    container.classList.add("cc-chart");
    container.replaceChildren();
    const box = div("cc-plot", container);
    function render(W) {
      box.replaceChildren();
      const H = opts.height || 220;
      const m = { l: 44, r: 12, t: 34, b: 30 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const vals = opts.values.filter((v) => isFinite(v));
      let lo = Math.min(...vals, opts.marker ? opts.marker.value : Infinity), hi = Math.max(...vals, opts.marker ? opts.marker.value : -Infinity);
      const nt = niceTicks(lo, hi, 6);
      const nb = opts.bins || 30;
      const bw = (nt.hi - nt.lo) / nb;
      const counts = new Array(nb).fill(0);
      for (const v of vals) counts[Math.min(nb - 1, Math.floor((v - nt.lo) / bw))]++;
      const cmax = Math.max(...counts);
      const X = (v) => m.l + ((v - nt.lo) / (nt.hi - nt.lo)) * iw;
      const Y = (c) => m.t + (1 - c / cmax) * ih;
      const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opts.aria || "histogram" }, box);
      svgEl("line", { x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih, stroke: cssVar("--axis") }, svg);
      counts.forEach((c, i) => {
        if (!c) return;
        const x0 = X(nt.lo + i * bw) + 1, x1 = X(nt.lo + (i + 1) * bw) - 1;
        const rect = svgEl("rect", { x: x0, y: Y(c), width: Math.max(1, x1 - x0), height: m.t + ih - Y(c), fill: cssVar(opts.colorVar || "--s-carry"), rx: 1 }, svg);
        rect.addEventListener("pointermove", (ev) => showTip(ev.clientX, ev.clientY, `${(opts.xFmt || fmt.num)(nt.lo + i * bw)} to ${(opts.xFmt || fmt.num)(nt.lo + (i + 1) * bw)}`, [{ name: "random draws", value: String(c) }]));
        rect.addEventListener("pointerleave", hideTip);
      });
      for (const t of nt.ticks) {
        const tx = svgEl("text", { x: X(t), y: H - 8, "text-anchor": "middle", class: "cc-axis-text", fill: cssVar("--muted") }, svg);
        tx.textContent = (opts.xFmt || fmt.num)(t);
      }
      if (opts.marker) {
        const x = X(opts.marker.value);
        svgEl("line", { x1: x, x2: x, y1: m.t - 10, y2: m.t + ih, stroke: cssVar("--s-crowd"), "stroke-width": 2 }, svg);
        const right = x > W * 0.6;
        const tx = svgEl("text", { x: right ? x + 4 : x - 4, y: 16, "text-anchor": right ? "end" : "start", class: "cc-end-label", fill: cssVar("--ink") }, svg);
        tx.textContent = opts.marker.label;
      }
    }
    return responsive(box, render);
  }

  // =====================================================================================
  // Table renderer: cols:[{key,label,fmt,cls}], rows:[{...}]
  function table(container, cols, rows, opts = {}) {
    container.replaceChildren();
    const wrap = div("cc-table-wrap", container);
    const t = document.createElement("table");
    t.className = "cc-table" + (opts.compact ? " compact" : "");
    const thead = t.createTHead().insertRow();
    for (const c of cols) { const th = document.createElement("th"); th.textContent = c.label; if (c.num !== false) th.className = "num"; thead.appendChild(th); }
    const tb = t.createTBody();
    for (const r of rows) {
      const tr = tb.insertRow();
      if (r._cls) tr.className = r._cls;
      for (const c of cols) {
        const td = tr.insertCell();
        const v = r[c.key];
        if (c.swatch && r._color) { const sw = document.createElement("span"); sw.className = "cc-swatch"; sw.style.background = cssVar(r._color); td.appendChild(sw); }
        td.appendChild(document.createTextNode(c.fmt ? c.fmt(v, r) : v == null ? "–" : String(v)));
        if (c.num !== false) td.className = "num";
      }
    }
    wrap.appendChild(t);
    return t;
  }

  return { lineChart, barChart, heatmap, histogram, table, fmt, cssVar, showTip, hideTip, divColor: divergingColor, yearTicks };
})();
</script>
<script>/* Performance statistics computed in the browser from daily gross returns and the turnover charged
   each day, so the cost slider and period presets recompute everything. Mirrors src/common.py:perf_stats. */
const Perf = (() => {
  const weekday = (day) => (((day + 4) % 7) + 7) % 7;          // 1970-01-01 was a Thursday
  const weekKey = (day, anchor) => day + ((anchor - weekday(day) + 7) % 7);

  function mean(x) { let s = 0; for (const v of x) s += v; return s / x.length; }
  function std(x) { const m = mean(x); let s = 0; for (const v of x) s += (v - m) * (v - m); return Math.sqrt(s / (x.length - 1)); }
  function skew(x) {
    const n = x.length; if (n < 3) return NaN;
    const m = mean(x); let m2 = 0, m3 = 0;
    for (const v of x) { const d = v - m; m2 += d * d; m3 += d * d * d; }
    m2 /= n; m3 /= n;
    return (Math.sqrt(n * (n - 1)) / (n - 2)) * (m3 / Math.pow(m2, 1.5));
  }
  function quantile(sorted, q) {
    const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
  }
  function net(g, to, costBps) {
    const c = costBps / 1e4, out = new Array(g.length);
    for (let i = 0; i < g.length; i++) out[i] = g[i] == null ? null : g[i] - c * (to[i] || 0);
    return out;
  }
  function weekly(days, r, anchor) {
    const out = [], keys = [];
    let cur = null, acc = 1;
    for (let i = 0; i < r.length; i++) {
      if (r[i] == null) continue;
      const k = weekKey(days[i], anchor);
      if (cur !== null && k !== cur) { out.push(acc - 1); keys.push(cur); acc = 1; }
      cur = k; acc *= 1 + r[i];
    }
    if (cur !== null) { out.push(acc - 1); keys.push(cur); }
    return { r: out, keys };
  }
  function wealth(r) {
    const w = new Array(r.length); let acc = 1;
    for (let i = 0; i < r.length; i++) { acc *= 1 + (r[i] || 0); w[i] = acc; }
    return w;
  }
  function stats(days, r, ppy, anchor, to) {
    const x = r.filter((v) => v != null);
    if (x.length < 10) return null;
    const am = mean(x) * ppy, av = std(x) * Math.sqrt(ppy);
    const w = wealth(r);
    let peak = -Infinity, mdd = 0;
    for (const v of w) { if (v > peak) peak = v; const d = v / peak - 1; if (d < mdd) mdd = d; }
    const wk = weekly(days, r, anchor).r;
    const srt = wk.slice().sort((a, b) => a - b);
    const q = quantile(srt, 0.05);
    const tail = wk.filter((v) => v <= q);
    let turn = null;
    if (to) {
      let s = 0, first = null, last = null;
      for (let i = 0; i < to.length; i++) if (to[i] > 0) { s += to[i]; if (first === null) first = days[i]; last = days[i]; }
      turn = first !== null && last > first ? s / ((last - first) / 365.25) : null;
    }
    const yrs = x.length / ppy;
    return {
      mean: am, vol: av, sharpe: am / av, mdd, cagr: Math.pow(w[w.length - 1], 1 / yrs) - 1,
      skew: skew(wk), worst: srt[0], es95: mean(tail), turnover: turn,
    };
  }
  return { net, weekly, wealth, stats, weekKey };
})();
</script>
